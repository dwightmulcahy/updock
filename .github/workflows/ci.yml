name: CI

on:
  push:
    branches: [main]          # feature branches run via pull_request; tags are handled by release.yml
  pull_request:
  workflow_call:              # reused by release.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15"  # keep in step with the Dockerfile base image
  IMAGE: updock:ci
  PORT: "8080"

jobs:
  compose:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.qnap.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.socket-proxy.yaml config --quiet
      - run: docker compose -f compose.qnap.yaml -f compose.socket-proxy.yaml config --quiet

  arm-v7:
    name: linux/arm/v7 image
    needs: [pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build for 32-bit ARM (Raspberry Pi 2/3, older NAS)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm/v7
          load: true
          tags: updock:armv7
          cache-from: type=gha,scope=armv7
          cache-to: type=gha,mode=max,scope=armv7
      - name: Starts and serves /livez under emulation
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm/v7 updock:armv7 python -c \
            "import platform, sys; print(platform.machine(), sys.version.split()[0]); assert platform.machine().startswith('armv7')"
          docker run -d --name armv7 --platform linux/arm/v7 -p 8090:8080 -e UPDOCK_INTERVAL=0 \
            --read-only --tmpfs /tmp updock:armv7
          for i in $(seq 1 60); do curl -fsS http://localhost:8090/livez && exit 0; sleep 2; done
          docker logs armv7; exit 1

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - run: python -m pytest -q

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - run: pip install -r requirements-e2e.txt
      - name: Install Chromium
        run: |
          for i in 1 2 3; do python -m playwright install --with-deps chromium && break; sleep $((i * 10)); done
      - name: Run browser tests
        run: python -m pytest e2e -q -p no:cacheprovider -o addopts=""

  docker-smoke:
    name: Docker image + smoke
    runs-on: ubuntu-latest
    needs: [pytest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          size=$(docker history --human=false --format '{{.Size}}' "$IMAGE" | awk '{s+=$1} END {print s}')
          gz=$(docker save "$IMAGE" | gzip -1 | wc -c)
          {
            echo "### Image size"
            echo "- uncompressed (sum of layers): $((size / 1000000)) MB"
            echo "- compressed (≈ download, gzip): $((gz / 1000000)) MB"
            echo
            echo '```'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' "$IMAGE" | cut -c1-150
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pre-pull test images (with retries for registry rate limits)
        run: |
          for img in busybox:stable lscr.io/linuxserver/socket-proxy:latest; do
            for i in 1 2 3 4 5; do
              docker pull -q "$img" && break
              [ "$i" = 5 ] && { echo "::error::could not pull $img"; exit 1; }
              echo "pull of $img failed (attempt $i), retrying in $((i * 10))s"; sleep $((i * 10))
            done
          done
      - name: Start hardened container
        run: |
          # secrets as files (chmod 600, owned by the runner user), like ./secrets with Compose
          mkdir -p ci-secrets && umask 077
          printf 'ci-secret\n' > ci-secrets/updock_password
          printf 'ci-token' > ci-secrets/updock_api_token
          docker run -d --name app -p ${PORT}:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v updock-ci-data:/data \
            -v "$PWD/ci-secrets:/run/secrets:ro" \
            -e UPDOCK_PASSWORD_FILE=/run/secrets/updock_password \
            -e UPDOCK_API_TOKEN_FILE=/run/secrets/updock_api_token \
            -e UPDOCK_INTERVAL=0 -e UPDOCK_LOG_LEVEL=DEBUG \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --cap-add DAC_READ_SEARCH --security-opt no-new-privileges:true \
            --pids-limit 200 --memory 256m \
            "$IMAGE"
      - name: Check /health
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${PORT}/health" && exit 0
            sleep 1
          done
          echo "::error::/health never became ready"; exit 1
      - name: Smoke tests
        run: |
          set -euo pipefail
          base="http://localhost:${PORT}"
          # auth enforced
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/containers")" = 401
          # UI served
          # to a file: with pipefail, grep -q exiting early makes curl fail (error 23)
          curl -fsS -u admin:ci-secret "$base/" -o page.html && grep -q "<title>Updock</title>" page.html
          # Docker socket reachable with all capabilities dropped; updock lists itself as excluded
          curl -fsS -u admin:ci-secret "$base/api/containers" | tee containers.json
          python3 -c "import json; c=json.load(open('containers.json'))['containers']; assert any(x['name']=='app' and not x['eligible'] for x in c), c"
          # end-to-end recreate of a throwaway container
          docker run -d --name smoke-target --label keep=yes busybox:stable sleep 600
          old="$(docker inspect -f '{{.Id}}' smoke-target)"
          curl -fsS -u admin:ci-secret -X POST "$base/api/containers/smoke-target/update?force=true"
          for i in $(seq 1 60); do
            new="$(docker inspect -f '{{.Id}}' smoke-target 2>/dev/null || true)"
            [ -n "$new" ] && [ "$new" != "$old" ] && [ "$(docker inspect -f '{{.State.Running}} {{index .Config.Labels "keep"}}' smoke-target)" = "true yes" ] && exit 0
            sleep 1
          done
          curl -s -u admin:ci-secret "$base/api/logs"; echo "::error::smoke-target was not recreated"; exit 1
      - name: Registry digest check (no pull)
        run: |
          set -euo pipefail
          base="http://localhost:${PORT}"
          job() {
            curl -fsS -u admin:ci-secret "$base/api/containers" | python3 -c \
              "import json,sys; c=[x for x in json.load(sys.stdin)['containers'] if x['name']=='smoke-target'][0]; print(c.get('job') or '')"
          }
          ok=0
          for i in $(seq 1 60); do
            j="$(job)"; echo "job=$j"
            if [ "$j" = up-to-date ]; then ok=1; break; fi
            # (re)queue a check once the previous job (recreate + health grace) has finished
            case "$j" in checking|pulling|updating) ;; *)
              curl -fsS -u admin:ci-secret -X POST "$base/api/containers/smoke-target/check" >/dev/null ;;
            esac
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "::error::digest check did not report up-to-date"; exit 1; }
          # proves the HEAD-digest path ran (not the pull fallback)
          curl -fsS -u admin:ci-secret "$base/api/logs?container=smoke-target&level=DEBUG&q=registry%20digest" \
            | python3 -c "import json,sys; e=json.load(sys.stdin)['entries']; print(e[-1]['msg'] if e else e); sys.exit(0 if e and e[-1]['msg'].endswith('matches') else 1)"
      - name: State and logs survive a restart
        run: |
          set -euo pipefail
          base="http://localhost:${PORT}"
          docker restart app >/dev/null
          for i in $(seq 1 30); do curl -fsS "$base/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -u admin:ci-secret "$base/api/containers" | python3 -c "
          import json, sys
          c = next(x for x in json.load(sys.stdin)['containers'] if x['name'] == 'smoke-target')
          print(c.get('job'), c.get('last_check'))
          sys.exit(0 if c.get('job') == 'up-to-date' and c.get('last_check') else 1)"
          curl -fsS -u admin:ci-secret "$base/api/logs?container=smoke-target&event=recreate" | python3 -c "
          import json, sys
          e = json.load(sys.stdin)['entries']
          print(len(e), 'recreate entries from before the restart')
          sys.exit(0 if e else 1)"
      - name: Probes and Prometheus metrics
        run: |
          set -euo pipefail
          base="http://localhost:${PORT}"
          for p in livez readyz startupz; do curl -fsS "$base/$p"; echo; done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/metrics")" = 401
          curl -fsS -u admin:ci-secret "$base/metrics" | tee metrics.txt | grep -E '^updock_(runs_total|results_total|containers_monitored)'
          grep -q 'updock_container_status{container="smoke-target"' metrics.txt
      - name: API token and live events
        run: |
          set -euo pipefail
          base="http://localhost:${PORT}"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' "$base/api/containers")" = 401
          curl -fsS -H 'Authorization: Bearer ci-token' "$base/metrics" >/dev/null
          (timeout 10 curl -sN -H 'Authorization: Bearer ci-token' "$base/api/events" > events.txt || true) &
          sleep 2
          curl -fsS -H 'Authorization: Bearer ci-token' -X POST "$base/api/containers/smoke-target/check"
          wait
          head -20 events.txt
          grep -q '^event: state' events.txt && grep -q '^event: log' events.txt
      - name: Through a Docker socket proxy (no socket in the Updock container)
        run: |
          set -euo pipefail
          docker network create dockerapi
          docker run -d --name socket-proxy --network dockerapi --label updock.enable=false \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e CONTAINERS=1 -e IMAGES=1 -e NETWORKS=1 -e POST=1 -e EXEC=1 -e SYSTEM=1 \
            lscr.io/linuxserver/socket-proxy:latest
          docker run -d --name app-proxied --network dockerapi -p 8082:8080 \
            -e DOCKER_HOST=tcp://socket-proxy:2375 -e UPDOCK_INTERVAL=0 -e UPDOCK_HOOKS=true \
            -e UPDOCK_DISK_WARN=500GB -e UPDOCK_STARTUP_GRACE=2 -e UPDOCK_API_TOKEN=proxy-token \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            "$IMAGE"
          base=http://localhost:8082; auth='Authorization: Bearer proxy-token'
          for i in $(seq 1 30); do curl -fsS "$base/readyz" && break; sleep 1; done; echo
          docker run -d --name proxy-target --label 'updock.hook.pre-update=echo hook-ran' \
            busybox:stable sleep 600
          old="$(docker inspect -f '{{.Id}}' proxy-target)"
          curl -fsS -H "$auth" -X POST "$base/api/containers/proxy-target/update?force=true"; echo
          ok=0
          for i in $(seq 1 60); do
            new="$(docker inspect -f '{{.Id}}' proxy-target 2>/dev/null || true)"
            if [ -n "$new" ] && [ "$new" != "$old" ] && \
               curl -fsS -H "$auth" "$base/api/containers" | python3 -c \
                 "import json,sys; c=[x for x in json.load(sys.stdin)['containers'] if x['name']=='proxy-target']; sys.exit(0 if c and c[0].get('job')=='updated' else 1)"; then
              ok=1; break
            fi
            sleep 1
          done
          curl -fsS -H "$auth" "$base/api/logs?container=proxy-target" | python3 -c \
            "import json,sys; [print(e['level'], e['msg']) for e in json.load(sys.stdin)['entries']]"
          [ "$ok" = 1 ] || { echo "::error::recreate through the proxy failed"; exit 1; }
          curl -fsS -H "$auth" "$base/api/logs?container=proxy-target&event=hook" -o hook.log && grep -q 'exited 0: hook-ran' hook.log
          curl -fsS -H "$auth" "$base/api/disk" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(d); sys.exit(0 if d['enabled'] and d['used'] > 0 else 1)"
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Container logs
        if: failure()
        run: docker logs app
