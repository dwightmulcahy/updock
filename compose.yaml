services:
  updock:
    build:
      context: .
    image: ${IMAGE:-updock:local}
    container_name: updock
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updock-data:/data
      # Private registries: mount your docker login config
      # - ~/.docker/config.json:/config/config.json:ro
    secrets: [updock_password, updock_api_token, updock_smtp_password]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    # Lets root in the container read ./secrets files that stay chmod 600 for your user
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    shm_size: 64m
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  updock-data:

# Files in ./secrets (create with scripts/init-secrets.sh); mounted at /run/secrets/<name>
secrets:
  updock_password:
    file: ./secrets/updock_password
  updock_api_token:
    file: ./secrets/updock_api_token
  updock_smtp_password:
    file: ./secrets/updock_smtp_password
