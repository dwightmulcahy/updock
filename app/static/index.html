<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Updock</title>
<script>try { const t = localStorage.getItem("updock.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --dim:#8a92a6;
          --accent:#4f8cff; --ok:#3ecf8e; --warn:#f5a524; --err:#ff5c5c;
          --hover:#ffffff05; --hover2:#ffffff08; --detail:#13161c; --sel:#1d2a44; --sel-text:#9fb4ff; --ok-bg:#173a2b; --warn-bg:#3a2e14; --info-bg:#14263f; --err-bg:#3d1a1a; --roll-bg:#3d2a14; --cool-bg:#1f2d3d; --cool:#7fb8ff; --purple-bg:#2a1f3d; --purple:#b48cff; --pin-bg:#2a2f3d; --queued-bg:#22262f; --step-bg:#1b1f27; --step:#5d6577; --step-now:#cfe0ff; --muted:#6b7385; --err-text:#ffb3b3; --run-bg:#14203a; --run-line:#22345a; --done-bg:#13241c; --done-line:#1d3b2c; --bad-bg:#2a1a1a; --bad-line:#4a2626; --track:#ffffff14; --accent-soft:#4f8cff55; --shadow:#0009; --backdrop:#0008; color-scheme:dark; }
  :root[data-theme=light] { --bg:#f4f6f9; --panel:#ffffff; --line:#dfe3ea; --text:#1b2030; --dim:#5d6577; --accent:#2f6fe0; --ok:#13995c; --warn:#a86400; --err:#d32f2f; --hover:#00000006; --hover2:#0000000a; --detail:#f6f8fb; --sel:#e3ecff; --sel-text:#2f55c8; --ok-bg:#dcf5e8; --warn-bg:#fdf0d5; --info-bg:#e1ecff; --err-bg:#fde2e2; --roll-bg:#fde9d3; --cool-bg:#e2edf8; --cool:#2a6bb3; --purple-bg:#efe6ff; --purple:#6b3fc9; --pin-bg:#e6e9f5; --queued-bg:#eceef2; --step-bg:#eef0f4; --step:#7a8294; --step-now:#1f4fb5; --muted:#8a91a0; --err-text:#b42323; --run-bg:#e8f0ff; --run-line:#c6d6f5; --done-bg:#e5f6ec; --done-line:#bfe5cf; --bad-bg:#fdeaea; --bad-line:#f1c4c4; --track:#00000014; --accent-soft:#2f6fe040; --shadow:#0003; --backdrop:#0005; color-scheme:light; }
  @media (prefers-color-scheme: light) { :root:not([data-theme=dark]) { --bg:#f4f6f9; --panel:#ffffff; --line:#dfe3ea; --text:#1b2030; --dim:#5d6577; --accent:#2f6fe0; --ok:#13995c; --warn:#a86400; --err:#d32f2f; --hover:#00000006; --hover2:#0000000a; --detail:#f6f8fb; --sel:#e3ecff; --sel-text:#2f55c8; --ok-bg:#dcf5e8; --warn-bg:#fdf0d5; --info-bg:#e1ecff; --err-bg:#fde2e2; --roll-bg:#fde9d3; --cool-bg:#e2edf8; --cool:#2a6bb3; --purple-bg:#efe6ff; --purple:#6b3fc9; --pin-bg:#e6e9f5; --queued-bg:#eceef2; --step-bg:#eef0f4; --step:#7a8294; --step-now:#1f4fb5; --muted:#8a91a0; --err-text:#b42323; --run-bg:#e8f0ff; --run-line:#c6d6f5; --done-bg:#e5f6ec; --done-line:#bfe5cf; --bad-bg:#fdeaea; --bad-line:#f1c4c4; --track:#00000014; --accent-soft:#2f6fe040; --shadow:#0003; --backdrop:#0005; color-scheme:light; } }
  button.primary { color:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; flex:1; }
  .meta { color:var(--dim); font-size:12px; }
  main { padding:20px 24px; max-width:1280px; margin:auto; }
  header { flex-wrap:wrap; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .toolbar input[type=search], .toolbar select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font:inherit; }
  .toolbar input[type=search] { min-width:220px; flex:1; max-width:360px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--dim); border-radius:99px; padding:4px 11px; font-size:13px; }
  .chip.on { background:var(--sel); border-color:var(--accent); color:var(--text); }
  .chip .n { color:var(--dim); margin-left:4px; font-size:12px; }
  .chip.on .n { color:var(--sel-text); }
  .chip.warnc .n { color:var(--warn); } .chip.errc .n { color:var(--err); }
  .toolbar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  table { table-layout:fixed; }
  col.c-name { width:30%; } col.c-ver { width:22%; } col.c-chk { width:90px; } col.c-act { width:160px; }
  td { overflow:hidden; }
  td { vertical-align:top; }
  tr.row { cursor:pointer; }
  tr.grp td { background:var(--hover2); border-top:1px solid var(--line); padding:6px 10px; font-size:13px; }
  tr.grp .gname { font-weight:600; } tr.grp .gmeta { color:var(--dim); margin-left:8px; font-size:12px; }
  tr.grp .actions button { padding:2px 9px; font-size:12px; }
  tr.ingrp td:first-child { padding-left:22px; }
  label.grp { display:inline-flex; align-items:center; gap:4px; margin-left:10px; cursor:pointer; white-space:nowrap; }
  tr.row:hover td { background:var(--hover); }
  .nm { font-weight:600; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .nm .chev { color:var(--dim); font-size:11px; width:10px; display:inline-block; transition:transform .15s; }
  tr.open .nm .chev { transform:rotate(90deg); }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background:var(--dim); vertical-align:1px; }
  .dot.running { background:var(--ok); } .dot.unhealthy { background:var(--warn); } .dot.exited, .dot.created { background:var(--muted); }
  .ver { font-size:13px; } .ver .arrow { color:var(--warn); margin:0 4px; } .ver .new { color:var(--warn); font-weight:600; }
  .ver .same { color:var(--ok); margin-left:4px; } .ver .unk { color:var(--dim); font-style:italic; }
  .msg { color:var(--err); font-size:12px; margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .msg.info { color:var(--dim); }
  .actions { display:flex; gap:6px; justify-content:flex-end; }
  .actions button { white-space:nowrap; }
  .more { padding:6px 9px; letter-spacing:1px; }
  tr.detail td { background:var(--detail); padding:14px 18px 16px; cursor:default; }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px 24px; }
  .dgrid h4 { margin:0 0 6px; font-size:11px; color:var(--dim); text-transform:uppercase; font-weight:500; letter-spacing:.04em; }
  .dfull { grid-column:1 / -1; font-size:12px; white-space:pre-wrap; word-break:break-word; }
  .dfull.err { color:var(--err-text); }
  #menu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px; min-width:190px; box-shadow:0 8px 24px var(--shadow); }
  #menu button { display:block; width:100%; text-align:left; background:none; padding:7px 10px; border-radius:5px; }
  #menu button:hover:not(:disabled) { background:var(--line); filter:none; }
  #menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  .empty { padding:28px; text-align:center; color:var(--dim); }
  #runbar { display:flex; align-items:center; gap:12px; padding:10px 24px; background:var(--run-bg); border-bottom:1px solid var(--run-line); font-size:13px; }
  #runbar[hidden] { display:none; }
  #runbar.done { background:var(--done-bg); border-color:var(--done-line); }
  #runbar.done.bad { background:var(--bad-bg); border-color:var(--bad-line); }
  #runbar .rb-bar { flex:0 0 220px; height:6px; background:var(--track); border-radius:3px; overflow:hidden; }
  #runbar .rb-bar i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  #runbar .rb-text { flex:1; } #runbar .rb-cur { color:var(--sel-text); }
  #runbar .x { background:none; color:var(--dim); padding:2px 8px; }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--accent-soft); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  .queued { background:var(--queued-bg); color:var(--dim); }
  .steps { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
  .steps span { font-size:11px; padding:1px 6px; border-radius:4px; background:var(--step-bg); color:var(--step); }
  .steps span.done { color:var(--ok); } .steps span.now { background:var(--sel); color:var(--step-now); }
  .stepmsg { font-size:12px; color:var(--dim); margin-top:4px; }
  @media (max-width: 900px) {
    col.c-chk, th.h-chk, td.t-chk { display:none; }
    col.c-name { width:36%; } col.c-ver { width:24%; } col.c-act { width:150px; }
    main { padding:12px; }
  }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; }
  tr:last-child td { border-bottom:0; }
  code { color:var(--dim); font-size:12px; }
  button { background:var(--line); color:var(--text); border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { filter:brightness(1.3); }
  button.primary { background:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:var(--line); }
  .up-to-date,.updated { background:var(--ok-bg); color:var(--ok); }
  .update-available { background:var(--warn-bg); color:var(--warn); }
  .pulling,.updating,.checking { background:var(--info-bg); color:var(--accent); }
  .error, .auth-required { background:var(--err-bg); color:var(--err); }
  .rolled-back { background:var(--roll-bg); color:var(--warn); }
  .cooldown, .skipped, .rate-limited { background:var(--cool-bg); color:var(--cool); }
  .msg { color:var(--err); font-size:12px; max-width:320px; }
  .actions { display:flex; gap:6px; justify-content:flex-end; }
  .logpanel { margin-top:24px; background:var(--panel); border-radius:8px; }
  .logbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
  .logbar h2 { font-size:14px; margin:0 8px 0 0; }
  .logbar select, .logbar input[type=search] { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  .logbar input[type=search] { flex:1; min-width:160px; }
  .logbar label { color:var(--dim); font-size:12px; display:flex; gap:4px; align-items:center; }
  .logbar .count { color:var(--dim); font-size:12px; margin-left:auto; }
  #logs { height:340px; overflow:auto; padding:6px 0; font:12px/1.55 ui-monospace,monospace; }
  #logs.tall { height:70vh; }
  .le { display:grid; grid-template-columns:140px 64px 150px 1fr; gap:10px; padding:1px 12px; }
  .le:hover { background:var(--hover2); }
  .le .t { color:var(--dim); } .le .c { color:var(--accent); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .le .m { white-space:pre-wrap; word-break:break-word; }
  .le .ev { color:var(--dim); }
  .lv { font-weight:600; } .lv.DEBUG { color:var(--muted); } .lv.INFO { color:var(--ok); } .lv.WARNING { color:var(--warn); } .lv.ERROR,.lv.CRITICAL { color:var(--err); }
  .le.ERROR .m, .le.CRITICAL .m { color:var(--err-text); }
  .le pre { margin:4px 0 0; color:var(--dim); white-space:pre-wrap; }
  .le summary { color:var(--dim); cursor:pointer; font-size:11px; }
  mark { background:var(--accent-soft); color:inherit; border-radius:2px; }
  .deployed, .reverted { background:var(--purple-bg); color:var(--purple); }
  .pinned-badge { background:var(--pin-bg); color:var(--sel-text); }
  tr.stopped td { opacity:.55; } tr.stopped td:last-child { opacity:1; }
  .bar { height:4px; background:var(--line); border-radius:2px; margin-top:6px; width:120px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  #vdetail { font-size:12px; color:var(--dim); min-height:3.2em; margin-bottom:10px; line-height:1.5; }
  #vdetail code { color:var(--text); }
  .img { font-size:12px; color:var(--dim); line-height:1.5; }
  .img .v { color:var(--text); font-size:13px; }
  .img a.notes { color:var(--accent); text-decoration:none; } .img a.notes:hover { text-decoration:underline; }
  .newer .v { color:var(--warn); }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:20px; min-width:360px; }
  dialog::backdrop { background:var(--backdrop); }
  dialog select { width:100%; margin:12px 0; padding:6px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; font:inherit; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; }
  #ldlg input:not([type=checkbox]) { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  #llist .li { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  #lmsg.err { color:var(--err); } #lmsg.ok { color:var(--ok); }
  @media (max-width: 640px) {
    header { padding:12px; gap:8px; } header h1 { flex-basis:100%; }
    main { padding:10px; }
    .toolbar input[type=search] { max-width:none; min-width:0; flex-basis:100%; }
    .toolbar .right { margin-left:0; flex-wrap:wrap; }
    label.grp { margin-left:0; }
    table, tbody { display:block; } thead, colgroup { display:none; }
    tr.row { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"name act" "ver ver" "stat stat";
             column-gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
    tr.row td { display:block; border:0; padding:2px 0; }
    tr.row td:nth-child(1) { grid-area:name; } tr.row td:nth-child(2) { grid-area:ver; }
    tr.row td:nth-child(3) { grid-area:stat; } tr.row td:nth-child(4) { display:none; }
    tr.row td:nth-child(5) { grid-area:act; align-self:start; }
    tr.ingrp td:first-child { padding-left:0; } tr.ingrp { padding-left:22px; }
    tr.detail, tr.grp { display:block; } tr.detail td, tr.grp td { display:block; border-bottom:1px solid var(--line); }
    tr.grp { display:flex; } tr.grp td { border:0; } tr.grp td:first-child { flex:1; }
    .msg { max-width:none; }
    #runbar { padding:8px 12px; flex-wrap:wrap; } #runbar .rb-bar { flex:1 0 100%; }
    .le { grid-template-columns:auto 1fr; } .le .c, .le .ev { display:none; }
    dialog { min-width:0; width:calc(100vw - 24px); }
  }
</style>
</head>
<body>
<header>
  <h1>Updock <span class="meta" id="ver"></span></h1>
  <span class="meta" id="disk" hidden></span>
  <span class="meta" id="next"></span>
  <button id="btn-check-all" onclick="startRun('check')" title="Check every container for a newer image">Check all</button>
  <button id="btn-update-all" class="primary" onclick="confirm('Update every container that has a newer image?') && startRun('update')">Update all</button>
  <button class="more" onclick="headerMenu(event)" title="More" aria-label="More">⋯</button>
  <button id="testmail" hidden onclick="testEmail()">Test email</button>
</header>
<div id="runbar" hidden role="status" aria-live="polite"></div>
<main>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search containers or images…" aria-label="Search">
    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
    <div class="right">
      <label class="meta" for="sort">Sort</label>
      <select id="sort">
        <option value="attention">Needs attention first</option>
        <option value="name">Name</option>
        <option value="checked">Last checked</option>
        <option value="updated">Recently updated</option>
      </select>
      <label class="meta grp"><input type="checkbox" id="group"> Group by project</label>
    </div>
  </div>
  <table>
    <colgroup><col class="c-name"><col class="c-ver"><col class="c-stat"><col class="c-chk"><col class="c-act"></colgroup>
    <thead><tr><th>Container</th><th>Version</th><th>Status</th><th class="h-chk">Checked</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="menu" hidden></div>
  <section class="logpanel" id="logpanel">
    <div class="logbar">
      <h2>Logs</h2>
      <select id="flevel" title="Minimum level">
        <option value="DEBUG">Debug+</option><option value="INFO" selected>Info+</option>
        <option value="WARNING">Warning+</option><option value="ERROR">Errors</option>
      </select>
      <select id="fctr" title="Container"><option value="">All containers</option></select>
      <select id="fev" title="Event"><option value="">All events</option></select>
      <input type="search" id="fq" placeholder="Search messages…">
      <label><input type="checkbox" id="flive" checked> Live</label>
      <label><input type="checkbox" id="ftall"> Expand</label>
      <button onclick="resetFilters()">Reset</button>
      <button onclick="downloadLogs('text')">Download .log</button>
      <button onclick="downloadLogs('json')">.json</button>
      <span class="count" id="lcount"></span>
    </div>
    <div id="logs"></div>
  </section>
</main>
<dialog id="ldlg">
  <b>Registry logins</b>
  <div class="meta" id="lnote" style="margin:6px 0 10px">Used for checks and pulls of private images. Passwords are never shown again.</div>
  <div id="llist"></div>
  <form id="lform" onsubmit="saveLogin(event)" style="display:grid;gap:8px;margin-top:12px">
    <input id="lhost" placeholder="Registry, e.g. ghcr.io or docker.io" required>
    <input id="luser" placeholder="Username" required autocomplete="off">
    <input id="lpass" type="password" placeholder="Password or access token" required autocomplete="new-password">
    <div class="meta" id="lhint"></div>
    <label class="meta"><input type="checkbox" id="lnoverify"> Save without checking it first</label>
    <div class="row">
      <button type="button" onclick="ldlg.close()">Close</button>
      <button class="primary" type="submit" id="lsave">Check &amp; save</button>
    </div>
    <div class="meta" id="lmsg" role="status"></div>
  </form>
</dialog>
<dialog id="vdlg">
  <b id="vtitle"></b>
  <div class="meta" id="vinfo">Loading tags…</div>
  <select id="vsel" size="10"></select>
  <div id="vdetail"></div>
  <div class="row">
    <button onclick="vdlg.close()">Cancel</button>
    <button class="primary" id="vdeploy" disabled onclick="deployTag()">Deploy</button>
  </div>
</dialog>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { if (!t) return "—"; const s = Date.now()/1000 - t;
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s/60)}m ago` : s < 86400 ? `${Math.floor(s/3600)}h ago` : `${Math.floor(s/86400)}d ago`; };
const busy = j => j === "pulling" || j === "updating" || j === "checking";
const mmss = secs => { secs = Math.max(0, Math.floor(secs)); return `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`; };
const safeUrl = u => typeof u === "string" && /^https?:\/\//i.test(u);
const short = d => d ? d.replace("sha256:", "").slice(0, 12) : "";
const imgCell = (i, cls = "") => !i ? '<span class="img">—</span>' : `<div class="img ${cls}">
  <div class="v">${esc(i.version || "no version label")}</div>
  <div>${[i.id ? `id <code>${esc(i.id)}</code>` : "", i.digest ? `digest <code>${esc(short(i.digest))}</code>` : ""].filter(Boolean).join(" · ")}</div>
  ${i.revision ? `<div>rev <code>${esc(i.revision)}</code></div>` : ""}
  ${i.created ? `<div>built ${esc(new Date(i.created).toLocaleDateString())}</div>` : ""}
  ${safeUrl(i.changelog) ? `<div><a class="notes" href="${esc(i.changelog)}" target="_blank" rel="noopener noreferrer">release notes ↗</a></div>` : ""}</div>`;

let vname = null;
async function openVersions(name) {
  vname = name;
  const sel = document.getElementById("vsel"), info = document.getElementById("vinfo"), btn = document.getElementById("vdeploy");
  document.getElementById("vtitle").textContent = `Deploy a version of ${name}`;
  sel.innerHTML = ""; btn.disabled = true; info.textContent = "Loading tags…";
  vdlg.showModal();
  const r = await fetch(`/api/containers/${encodeURIComponent(name)}/tags`);
  const d = await r.json();
  if (!r.ok) { info.textContent = d.detail || "Failed to load tags"; return; }
  info.textContent = `${d.image} — ${d.tags.length} tags, current: ${d.current || "pinned"}`;
  sel.innerHTML = d.tags.map(t => `<option value="${esc(t)}"${t === d.current ? " selected" : ""}>${esc(t)}${t === d.current ? "  (current)" : ""}</option>`).join("");

  const d = await (await fetch("/api/logs?" + p)).json(), box = $("logs");
  setOptions($("fctr"), d.containers, "All containers", saved.container && !$("fctr").dataset.html ? saved.container : undefined);
  setOptions($("fev"), d.events, "All events", saved.event && !$("fev").dataset.html ? saved.event : undefined);
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 5;
  box.innerHTML = d.entries.map(e => `<div class="le ${e.level}">
    <span class="t" title="${new Date(e.t*1000).toLocaleString()}">${ts(e.t)}</span>
    <span class="lv ${e.level}">${e.level}</span>
    <span class="c" onclick="pickContainer('${esc(e.container || "")}')" title="${esc(e.container || e.logger)}">${esc(e.container || "")}${e.event ? ` <span class="ev">${esc(e.event)}</span>` : ""}</span>
    <span class="m">${hl(e.msg, f.q)}${e.exc ? `<details><summary>traceback</summary><pre>${esc(e.exc)}</pre></details>` : ""}</span></div>`).join("")
    || '<div class="le"><span></span><span></span><span></span><span class="m" style="color:var(--dim)">No log entries match these filters.</span></div>';
  $("lcount").textContent = `${d.entries.length} shown`;
  if (atBottom || force) box.scrollTop = box.scrollHeight;
}
function onFilter() { saveFilters(); refreshLogs(true); }
for (const id of ["flevel", "fctr", "fev"]) $(id).addEventListener("change", onFilter);
let qTimer; $("fq").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(onFilter, 250); });
$("flive").addEventListener("change", () => refreshLogs(true));
$("ftall").addEventListener("change", () => $("logs").classList.toggle("tall", $("ftall").checked));
function pickContainer(name) {
  setOptions($("fctr"), [], "All containers", name);
  onFilter(); $("logpanel").scrollIntoView({ behavior: "smooth" });
}
function resetFilters() {
  $("flevel").value = "INFO"; $("fq").value = ""; $("fctr").value = ""; $("fev").value = "";
  onFilter();
}
function downloadLogs(fmt) {
  const p = filterQuery(); p.set("fmt", fmt);
  location.href = "/api/logs/download?" + p;
}

const HINTS = {"ghcr.io": "GitHub username + a personal access token (classic) with the read:packages scope.",
               "docker.io": "Docker Hub username + an access token (Account settings → Personal access tokens)."};
const hubHost = h => ["registry-1.docker.io", "index.docker.io", "docker.io"].includes(h) ? "docker.io" : h;
async function openLogins(host) {
  $("lmsg").textContent = ""; $("lmsg").className = "meta"; $("lpass").value = "";
  if (host) { $("lhost").value = hubHost(host); }
  $("lhint").textContent = HINTS[hubHost($("lhost").value.trim())] || "";
  await renderLogins();
  ldlg.showModal();
  (host ? $("luser") : $("lhost")).focus();
}
$("lhost").addEventListener("input", () => { $("lhint").textContent = HINTS[hubHost($("lhost").value.trim())] || ""; });
async function renderLogins() {
  const d = await fetch("/api/registries").then(r => r.json()).catch(() => ({logins: []}));
  $("llist").innerHTML = d.logins.length ? d.logins.map(l => `<div class="li"><span><b>${esc(l.host)}</b> · ${esc(l.username)}</span>
      <button onclick="removeLogin('${esc(l.host)}')">Remove</button></div>`).join("")
    : '<div class="meta">No saved logins.</div>';
  if (d.persisted === false) $("lnote").textContent = "Logins are kept in memory only (no writable /data): they'll be gone after a restart.";
}
async function saveLogin(ev) {
  ev.preventDefault();
  const btn = $("lsave"), msg = $("lmsg");
  btn.disabled = true; msg.className = "meta"; msg.textContent = "Checking the login with the registry…";
  const r = await fetch("/api/registries" + ($("lnoverify").checked ? "?verify=false" : ""), {
    method: "POST", headers: { "Content-Type": "application/json", "X-Updock-Request": "1" },
    body: JSON.stringify({ host: $("lhost").value, username: $("luser").value, password: $("lpass").value })});
  const d = await r.json().catch(() => ({}));
  btn.disabled = false;
  if (!r.ok) { msg.className = "err"; msg.textContent = d.detail || `Failed (${r.status})`; return; }
  $("lpass").value = "";
  msg.className = "ok";
  msg.textContent = `Saved for ${d.host}.` + (d.rechecking.length ? ` Re-checking ${d.rechecking.join(", ")}…` : "");
  await renderLogins(); setTimeout(refresh, 500);
}
async function removeLogin(host) {
  if (!confirm(`Remove the saved login for ${host}?`)) return;
  await fetch(`/api/registries/${encodeURIComponent(host)}`, { method: "DELETE", headers: { "X-Updock-Request": "1" } });
  await renderLogins();
}
async function testEmail() {
  const btn = $("testmail"); btn.disabled = true; btn.textContent = "Sending…";
  const r = await fetch("/api/notify/test", { method: "POST", headers: { "X-Updock-Request": "1" } });
  const d = await r.json().catch(() => ({}));
  alert(r.ok ? `Test email sent to ${d.to.join(", ")}` : (d.detail || "Test email failed"));
  btn.disabled = false; btn.textContent = "Test email";
  refreshLogs(true);
}
async function refreshDisk() {
  const d = await fetch("/api/disk").then(r => r.json()).catch(() => null), el = $("disk");
  if (!d || !d.enabled) { el.hidden = true; return; }
  const gb = b => (b / 1e9).toFixed(1) + " GB";
  el.hidden = false;
  el.textContent = `Images ${d.used != null ? gb(d.used) : "?"}${d.max ? " / " + gb(d.max) : ""}`;
  el.style.color = d.status === "blocked" ? "var(--err)" : d.status === "warning" ? "var(--warn)" : "";
  el.title = `${d.images} images, ${gb(d.reclaimable)} reclaimable` +
    (d.warn ? `, warn at ${gb(d.warn)}` : "") + (d.status === "blocked" ? " — updates paused" : "");
}
refreshDisk(); setInterval(refreshDisk, 60000);

fetch("/api/notify").then(r => r.json()).then(n => {
  const b = $("testmail"); b.hidden = true; b.dataset.on = n.enabled ? "1" : "";
  b.title = n.enabled ? `Email ${n.events.join(", ")} to ${n.to.join(", ")} via ${n.server}` : "";
}).catch(() => {});

// Live updates over Server-Sent Events; fall back to polling when unavailable.
let live = false, tRows, tLogs;
const soon = (fn, t, ms) => { clearTimeout(t); return setTimeout(fn, ms); };
function connectEvents() {
  if (!window.EventSource) return;
  const es = new EventSource("/api/events");
  es.onopen = () => { live = true; };
  es.addEventListener("state", () => { tRows = soon(refresh, tRows, 250); });
  es.addEventListener("run", ev => {
    try { const d = JSON.parse(ev.data); RUN = d.run; if (d.last_run && d.last_run.t) LAST = d.last_run; } catch (e) {}
    if (RUN) optimistic = null;
    renderRun(); tRows = soon(refresh, tRows, 250);
  });
  es.addEventListener("log", () => { tLogs = soon(() => refreshLogs(), tLogs, 300); });
  es.onerror = () => { live = false; };  // EventSource reconnects by itself
}
connectEvents();
$("q").value = view.q; $("sort").value = view.sort; $("group").checked = !!view.group;
$("group").addEventListener("change", () => { view.group = $("group").checked; saveView(); render(); });
$("q").addEventListener("input", () => { view.q = $("q").value.trim(); saveView(); render(); });
$("sort").addEventListener("change", () => { view.sort = $("sort").value; saveView(); render(); });
refresh();
setInterval(() => { if (!live) refresh(); }, 3000);   // polling only while not live
setInterval(() => { if (live) refresh(); }, 30000);   // slow safety refresh when live
</script>
</body>
