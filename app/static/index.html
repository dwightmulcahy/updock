<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Updock</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --dim:#8a92a6;
          --accent:#4f8cff; --ok:#3ecf8e; --warn:#f5a524; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; flex:1; }
  .meta { color:var(--dim); font-size:12px; }
  main { padding:24px; max-width:1200px; margin:auto; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; }
  tr:last-child td { border-bottom:0; }
  code { color:var(--dim); font-size:12px; }
  button { background:var(--line); color:var(--text); border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { filter:brightness(1.3); }
  button.primary { background:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:var(--line); }
  .up-to-date,.updated { background:#173a2b; color:var(--ok); }
  .update-available { background:#3a2e14; color:var(--warn); }
  .pulling,.updating,.checking { background:#14263f; color:var(--accent); }
  .error { background:#3d1a1a; color:var(--err); }
  .rolled-back { background:#3d2a14; color:var(--warn); }
  .cooldown, .skipped { background:#1f2d3d; color:#7fb8ff; }
  .msg { color:var(--err); font-size:12px; max-width:320px; }
  .actions { display:flex; gap:6px; justify-content:flex-end; }
  .logpanel { margin-top:24px; background:var(--panel); border-radius:8px; }
  .logbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
  .logbar h2 { font-size:14px; margin:0 8px 0 0; }
  .logbar select, .logbar input[type=search] { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  .logbar input[type=search] { flex:1; min-width:160px; }
  .logbar label { color:var(--dim); font-size:12px; display:flex; gap:4px; align-items:center; }
  .logbar .count { color:var(--dim); font-size:12px; margin-left:auto; }
  #logs { height:340px; overflow:auto; padding:6px 0; font:12px/1.55 ui-monospace,monospace; }
  #logs.tall { height:70vh; }
  .le { display:grid; grid-template-columns:140px 64px 150px 1fr; gap:10px; padding:1px 12px; }
  .le:hover { background:#ffffff08; }
  .le .t { color:var(--dim); } .le .c { color:var(--accent); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .le .m { white-space:pre-wrap; word-break:break-word; }
  .le .ev { color:var(--dim); }
  .lv { font-weight:600; } .lv.DEBUG { color:#6b7385; } .lv.INFO { color:var(--ok); } .lv.WARNING { color:var(--warn); } .lv.ERROR,.lv.CRITICAL { color:var(--err); }
  .le.ERROR .m, .le.CRITICAL .m { color:#ffb3b3; }
  .le pre { margin:4px 0 0; color:var(--dim); white-space:pre-wrap; }
  .le summary { color:var(--dim); cursor:pointer; font-size:11px; }
  mark { background:#4f8cff55; color:inherit; border-radius:2px; }
  .deployed { background:#2a1f3d; color:#b48cff; }
  .pinned-badge { background:#2a2f3d; color:#9fb4ff; }
  tr.stopped td { opacity:.55; } tr.stopped td:last-child { opacity:1; }
  .bar { height:4px; background:var(--line); border-radius:2px; margin-top:6px; width:120px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  #vdetail { font-size:12px; color:var(--dim); min-height:3.2em; margin-bottom:10px; line-height:1.5; }
  #vdetail code { color:var(--text); }
  .img { font-size:12px; color:var(--dim); line-height:1.5; }
  .img .v { color:var(--text); font-size:13px; }
  .newer .v { color:var(--warn); }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:20px; min-width:360px; }
  dialog::backdrop { background:#0008; }
  dialog select { width:100%; margin:12px 0; padding:6px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; font:inherit; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>
<header>
  <h1>Updock <span class="meta" id="ver"></span></h1>
  <span class="meta" id="disk" hidden></span>
  <span class="meta" id="next"></span>
  <button id="testmail" hidden onclick="testEmail()" title="Send a test notification email">Test email</button>
  <button onclick="post('/api/check-all')">Check all</button>
  <button class="primary" onclick="post('/api/update-all')">Update all</button>
</header>
<main>
  <table>
    <thead><tr><th>Container</th><th>Running</th><th>Latest available</th><th>State</th><th>Update</th><th>Last check</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <section class="logpanel" id="logpanel">
    <div class="logbar">
      <h2>Logs</h2>
      <select id="flevel" title="Minimum level">
        <option value="DEBUG">Debug+</option><option value="INFO" selected>Info+</option>
        <option value="WARNING">Warning+</option><option value="ERROR">Errors</option>
      </select>
      <select id="fctr" title="Container"><option value="">All containers</option></select>
      <select id="fev" title="Event"><option value="">All events</option></select>
      <input type="search" id="fq" placeholder="Search messages…">
      <label><input type="checkbox" id="flive" checked> Live</label>
      <label><input type="checkbox" id="ftall"> Expand</label>
      <button onclick="resetFilters()">Reset</button>
      <button onclick="downloadLogs('text')">Download .log</button>
      <button onclick="downloadLogs('json')">.json</button>
      <span class="count" id="lcount"></span>
    </div>
    <div id="logs"></div>
  </section>
</main>
<dialog id="vdlg">
  <b id="vtitle"></b>
  <div class="meta" id="vinfo">Loading tags…</div>
  <select id="vsel" size="10"></select>
  <div id="vdetail"></div>
  <div class="row">
    <button onclick="vdlg.close()">Cancel</button>
    <button class="primary" id="vdeploy" disabled onclick="deployTag()">Deploy</button>
  </div>
</dialog>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { if (!t) return "—"; const s = Date.now()/1000 - t;
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s/60)}m ago` : s < 86400 ? `${Math.floor(s/3600)}h ago` : `${Math.floor(s/86400)}d ago`; };
const busy = j => j === "pulling" || j === "updating" || j === "checking";
const short = d => d ? d.replace("sha256:", "").slice(0, 12) : "";
const imgCell = (i, cls = "") => !i ? '<span class="img">—</span>' : `<div class="img ${cls}">
  <div class="v">${esc(i.version || "no version label")}</div>
  <div>${[i.id ? `id <code>${esc(i.id)}</code>` : "", i.digest ? `digest <code>${esc(short(i.digest))}</code>` : ""].filter(Boolean).join(" · ")}</div>
  ${i.revision ? `<div>rev <code>${esc(i.revision)}</code></div>` : ""}
  ${i.created ? `<div>built ${esc(new Date(i.created).toLocaleDateString())}</div>` : ""}</div>`;

let vname = null;
async function openVersions(name) {
  vname = name;
  const sel = document.getElementById("vsel"), info = document.getElementById("vinfo"), btn = document.getElementById("vdeploy");
  document.getElementById("vtitle").textContent = `Deploy a version of ${name}`;
  sel.innerHTML = ""; btn.disabled = true; info.textContent = "Loading tags…";
  vdlg.showModal();
  const r = await fetch(`/api/containers/${encodeURIComponent(name)}/tags`);
  const d = await r.json();
  if (!r.ok) { info.textContent = d.detail || "Failed to load tags"; return; }
  info.textContent = `${d.image} — ${d.tags.length} tags, current: ${d.current || "pinned"}`;
  sel.innerHTML = d.tags.map(t => `<option value="${esc(t)}"${t === d.current ? " selected" : ""}>${esc(t)}${t === d.current ? "  (current)" : ""}</option>`).join("");
  sel.onchange = () => { btn.disabled = !sel.value; showTag(name, sel.value); };
  if (sel.value) showTag(name, sel.value);
  btn.disabled = !sel.value;
}
let tagReq = 0;
async function showTag(name, tag) {
  const box = document.getElementById("vdetail"), my = ++tagReq;
  box.textContent = `Reading ${tag}…`;
  const r = await fetch(`/api/containers/${encodeURIComponent(name)}/tags/${encodeURIComponent(tag)}`);
  const d = await r.json().catch(() => ({}));
  if (my !== tagReq) return;  // a newer selection won
  box.innerHTML = !r.ok ? esc(d.detail || "Could not read tag details")
    : [`<b>${esc(d.version || "no version label")}</b>`,
       [d.id ? `id <code>${esc(d.id)}</code>` : "", d.digest ? `digest <code>${esc(short(d.digest))}</code>` : ""].filter(Boolean).join(" · "),
       [d.revision ? `rev <code>${esc(d.revision)}</code>` : "", d.created ? `built ${esc(new Date(d.created).toLocaleString())}` : ""].filter(Boolean).join(" · ")
      ].filter(Boolean).join("<br>");
}
async function deployTag() {
  const tag = document.getElementById("vsel").value;
  if (!tag || !confirm(`Deploy ${vname} with tag "${tag}"?`)) return;
  vdlg.close();
  await post(`/api/containers/${encodeURIComponent(vname)}/deploy?tag=${encodeURIComponent(tag)}`);
}

async function post(url) {
  const r = await fetch(url, { method: "POST", headers: { "X-Updock-Request": "1" } });
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert(d.detail || `Request failed (${r.status})`); }
  setTimeout(refresh, 300);
}

async function refresh() {
  try {
    const r = await fetch("/api/containers"); const d = await r.json();
    document.getElementById("ver").textContent = d.version === "dev" ? "dev" : `v${d.version}`;
    const sc = d.schedule || {}, nx = document.getElementById("next");
    nx.textContent = d.next_run
      ? `Next ${d.auto_update ? "update" : "check"}: ${new Date(d.next_run*1000).toLocaleString()}` : "Schedule off";
    nx.title = [sc.cron ? `cron "${sc.cron}" (${sc.tz})` : sc.interval ? `every ${sc.interval}s` : "",
                sc.window ? `updates only ${sc.window} (${sc.tz})` : ""].filter(Boolean).join(" · ");
    if (sc.window && d.next_run) nx.textContent += ` · window ${sc.window}`;
    document.getElementById("rows").innerHTML = d.containers.map(c => {
      const n = encodeURIComponent(c.name), dis = busy(c.job) || !c.eligible ? "disabled" : "";
      const pin = c.pinned ? "false" : "true";
      return `<tr class="${c.state === "running" ? "" : "stopped"}">
        <td><b>${esc(c.name)}</b>${c.eligible ? "" : ' <span class="badge">excluded</span>'}${c.pinned ? ' <span class="badge pinned-badge" title="Scheduled runs only check this container">pinned</span>' : ""}</td>
        <td><div>${esc(c.image)}</div>${imgCell(c.current)}</td>
        <td>${c.latest ? (c.current && c.latest.id === c.current.id ? '<span class="img">same as running</span>' : imgCell(c.latest, "newer")) : '<span class="img">not checked</span>'}</td>
        <td>${esc(c.status)}</td>
        <td><span class="badge ${esc(c.job)}">${esc((c.job || "unchecked").replaceAll("-", " "))}</span>
            ${c.progress != null ? `<div class="bar" title="${c.progress}%"><i style="width:${Number(c.progress)}%"></i></div>` : ""}
            ${["error", "rolled-back", "cooldown", "skipped"].includes(c.job) && c.message ? `<div class="msg">${esc(c.message)}</div>` : ""}</td>
        <td>${ago(c.last_check)}</td>
        <td><div class="actions">
          <button ${dis} onclick="post('/api/containers/${n}/check')">Check</button>
          <button ${dis} class="primary" onclick="post('/api/containers/${n}/update')">Update now</button>
          <button ${dis} title="Recreate even if image unchanged" onclick="if(confirm('Recreate ${esc(c.name)}?'))post('/api/containers/${n}/update?force=true')">Recreate</button>
          <button ${dis} title="Deploy a specific (e.g. older) tag" onclick="openVersions('${esc(c.name)}')">Versions…</button>
          <button ${c.eligible ? "" : "disabled"} title="${c.pinned ? "Let scheduled runs update it again" : "Scheduled runs will only check it"}" onclick="post('/api/containers/${n}/pin?pinned=${pin}')">${c.pinned ? "Unpin" : "Pin"}</button>
          <button title="Show this container's logs" onclick="pickContainer('${esc(c.name)}')">Logs</button>
        </div></td></tr>`;
    }).join("");
    await refreshLogs();
  } catch (e) { console.error(e); }
}
const $ = id => document.getElementById(id);
const LS_KEY = "updock.logfilters";
function filters() {
  return { level: $("flevel").value, container: $("fctr").value, event: $("fev").value, q: $("fq").value.trim() };
}
function filterQuery(f = filters()) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(f)) if (v) p.set(k, v);
  return p;
}
function saveFilters() { try { localStorage.setItem(LS_KEY, JSON.stringify(filters())); } catch (e) {} }
function loadFilters() {
  try {
    const f = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    if (f.level) $("flevel").value = f.level;
    if (f.q) $("fq").value = f.q;
    return f;
  } catch (e) { return {}; }
}
const saved = loadFilters();
function setOptions(sel, values, label, keep) {
  const cur = keep ?? sel.value;
  const opts = [""].concat(values).concat(cur && !values.includes(cur) ? [cur] : []);
  const html = opts.map(v => `<option value="${esc(v)}">${v ? esc(v) : label}</option>`).join("");
  if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; }
  sel.value = cur || "";
}
const pad = n => String(n).padStart(2, "0");
function ts(t) {
  const d = new Date(t * 1000), now = new Date();
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  return d.toDateString() === now.toDateString() ? time : `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${time}`;
}
function hl(text, q) {
  const t = esc(text);
  if (!q) return t;
  const i = t.toLowerCase().indexOf(esc(q).toLowerCase());
  return i < 0 ? t : t.slice(0, i) + "<mark>" + t.slice(i, i + esc(q).length) + "</mark>" + t.slice(i + esc(q).length);
}
async function refreshLogs(force) {
  if (!force && !$("flive").checked) return;
  const f = filters(), p = filterQuery(f); p.set("limit", "1000");
  const d = await (await fetch("/api/logs?" + p)).json(), box = $("logs");
  setOptions($("fctr"), d.containers, "All containers", saved.container && !$("fctr").dataset.html ? saved.container : undefined);
  setOptions($("fev"), d.events, "All events", saved.event && !$("fev").dataset.html ? saved.event : undefined);
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 5;
  box.innerHTML = d.entries.map(e => `<div class="le ${e.level}">
    <span class="t" title="${new Date(e.t*1000).toLocaleString()}">${ts(e.t)}</span>
    <span class="lv ${e.level}">${e.level}</span>
    <span class="c" onclick="pickContainer('${esc(e.container || "")}')" title="${esc(e.container || e.logger)}">${esc(e.container || "")}${e.event ? ` <span class="ev">${esc(e.event)}</span>` : ""}</span>
    <span class="m">${hl(e.msg, f.q)}${e.exc ? `<details><summary>traceback</summary><pre>${esc(e.exc)}</pre></details>` : ""}</span></div>`).join("")
    || '<div class="le"><span></span><span></span><span></span><span class="m" style="color:var(--dim)">No log entries match these filters.</span></div>';
  $("lcount").textContent = `${d.entries.length} shown`;
  if (atBottom || force) box.scrollTop = box.scrollHeight;
}
function onFilter() { saveFilters(); refreshLogs(true); }
for (const id of ["flevel", "fctr", "fev"]) $(id).addEventListener("change", onFilter);
let qTimer; $("fq").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(onFilter, 250); });
$("flive").addEventListener("change", () => refreshLogs(true));
$("ftall").addEventListener("change", () => $("logs").classList.toggle("tall", $("ftall").checked));
function pickContainer(name) {
  setOptions($("fctr"), [], "All containers", name);
  onFilter(); $("logpanel").scrollIntoView({ behavior: "smooth" });
}
function resetFilters() {
  $("flevel").value = "INFO"; $("fq").value = ""; $("fctr").value = ""; $("fev").value = "";
  onFilter();
}
function downloadLogs(fmt) {
  const p = filterQuery(); p.set("fmt", fmt);
  location.href = "/api/logs/download?" + p;
}

async function testEmail() {
  const btn = $("testmail"); btn.disabled = true; btn.textContent = "Sending…";
  const r = await fetch("/api/notify/test", { method: "POST", headers: { "X-Updock-Request": "1" } });
  const d = await r.json().catch(() => ({}));
  alert(r.ok ? `Test email sent to ${d.to.join(", ")}` : (d.detail || "Test email failed"));
  btn.disabled = false; btn.textContent = "Test email";
  refreshLogs(true);
}
async function refreshDisk() {
  const d = await fetch("/api/disk").then(r => r.json()).catch(() => null), el = $("disk");
  if (!d || !d.enabled) { el.hidden = true; return; }
  const gb = b => (b / 1e9).toFixed(1) + " GB";
  el.hidden = false;
  el.textContent = `Images ${d.used != null ? gb(d.used) : "?"}${d.max ? " / " + gb(d.max) : ""}`;
  el.style.color = d.status === "blocked" ? "var(--err)" : d.status === "warning" ? "var(--warn)" : "";
  el.title = `${d.images} images, ${gb(d.reclaimable)} reclaimable` +
    (d.warn ? `, warn at ${gb(d.warn)}` : "") + (d.status === "blocked" ? " — updates paused" : "");
}
refreshDisk(); setInterval(refreshDisk, 60000);

fetch("/api/notify").then(r => r.json()).then(n => {
  const b = $("testmail"); b.hidden = !n.enabled;
  b.title = n.enabled ? `Email ${n.events.join(", ")} to ${n.to.join(", ")} via ${n.server}` : "";
}).catch(() => {});

refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
